################################
# NORD BLUE — FINAL
################################

# Font
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        18.0
enable_ligatures yes

################################
# CURSOR — NORD
################################

cursor_shape block
cursor_blink on
cursor_blink_interval 0.6
cursor #88c0d0
cursor_text_color #2e3440

################################
# WINDOW
################################

initial_window_width  90c
initial_window_height 30c
background_opacity 0.72
#background_opacity 1
hide_window_decorations yes
rounded_corners yes

################################
# SCROLLBACK
################################

scrollback_lines 10000
scrollback_pager history

################################
# MOUSE & CLIPBOARD
################################

copy_on_select yes
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

################################
# BELL
################################

enable_audio_bell yes
visual_bell_duration 0
# marcar la pestana/ventana y el dock cuando llega el bell (p.ej. Claude en tmux)
window_alert_on_bell yes
bell_on_tab "🔔 "

################################
# NORD BLUE — POLAR NIGHT / FROST
################################

background #2e3440
foreground #d8dee9

selection_background #4c566a
selection_foreground #eceff4

################################
# ANSI COLORS
################################

# Black
color0  #3b4252
color8  #4c566a

# Red — errors
color1  #bf616a
color9  #bf616a

# Green
color2  #a3be8c
color10 #a3be8c

# Yellow
color3  #ebcb8b
color11 #ebcb8b

# Blue — NORD FROST CORE
color4  #81a1c1
color12 #88c0d0

# Magenta
color5  #b48ead
color13 #b48ead

# Cyan — UI / links
color6  #88c0d0
color14 #8fbcbb

# White
color7  #e5e9f0
color15 #eceff4

################################
# TAB BAR — NORD BLUE DOMINANT
################################

active_tab_background   #2e3440
active_tab_foreground   #88c0d0
inactive_tab_background #3b4252
inactive_tab_foreground #4c566a

################################
# URLS
################################

open_url_with default
detect_urls yes
